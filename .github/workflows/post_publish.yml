name: Post Publish PoC
on:
  workflow_dispatch:
    inputs:
      release-tag:
        type: string
        description: 'Semver release tag e.g. v1.1.0'
        required: true
  workflow_run:
    workflows: [Release]
    types:
      - completed
jobs:
  on-success-or-workflow-dispatch:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      release-tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - if: github.event_name == 'workflow_run'
        name: Download Artifact from Release workflow
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: release.yml
          name: release-tag
      - name: Output Release Tag
        id: release-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.release-tag }}" >> "$GITHUB_OUTPUT"
          else
            value=`cat release-tag.data`
            echo "tag=$value" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect step outputs produced from artifact content
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
          INJ: ${{ steps.release-tag.outputs.INJECTED_OUTPUT }}
        run: |
          printf 'tag output      => [%s]\n' "$TAG"
          printf 'injected output => [%s]\n' "$INJ"
  consumer:
    needs: [on-success-or-workflow-dispatch]
    runs-on: ubuntu-latest
    steps:
      - name: Show downstream strings built from the release tag
        env:
          TAG: ${{ needs.on-success-or-workflow-dispatch.outputs.release-tag }}
        run: |
          printf 'GitHub search q => repo:PDFtoMark/gab-poc-postpublish+milestone:%s\n' "$TAG"
          printf 'Jira comment    => resolved in [%s|https://github.com/o/r/releases/tag/%s]\n' "$TAG" "$TAG"
